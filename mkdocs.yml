site_name: Okta Privileged Access Getting Started Guide
docs_dir: docs
site_dir: site
use_directory_urls: false  # keeps the raw <img src="../media/..."> paths resolving

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

extra_css:
  - extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - print-site   # keep last

nav:
  - Overview: README.md
  - "Introduction":
    - 01-introduction/README.md
    - "Okta Privileged Access": 01-introduction/01-okta-privileged-access.md
